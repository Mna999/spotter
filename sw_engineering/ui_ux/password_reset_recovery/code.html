<script>
  let countdown = 48;
  let timerInterval = null;

  function startCountdown() {
    const resendBtn = document.getElementById('resend-btn');
    const resendText = document.getElementById('resend-text');
    if (!resendBtn || !resendText) return;
    
    clearInterval(timerInterval);
    countdown = 48;
    resendBtn.disabled = true;
    resendBtn.classList.add('opacity-50');

    timerInterval = setInterval(() => {
      countdown--;
      if (countdown > 0) {
        resendText.textContent = `Resend in ${countdown}s`;
      } else {
        clearInterval(timerInterval);
        resendText.textContent = 'Resend Code • إعادة';
        resendBtn.disabled = false;
        resendBtn.classList.remove('opacity-50');
      }
    }, 1000);
  }

  function handleResend() {
    if (countdown <= 0) {
      startCountdown();
    }
  }

  function triggerSentState() {
    const card = document.getElementById('dispatched-card');
    const btn = document.getElementById('submit-btn');
    if (!card || !btn) return;

    btn.innerHTML = `<span class="material-symbols-outlined text-[20px] animate-spin">refresh</span><span>Dispatched • تم الإرسال</span>`;
    setTimeout(() => {
      btn.innerHTML = `<span>Sent Successfully • تم الإرسال</span><span class="material-symbols-outlined text-[20px]">check</span>`;
      card.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
      startCountdown();
    }, 450);
  }

  function openSupportModal() {
    document.getElementById('support-modal')?.classList.remove('hidden');
  }

  function closeSupportModal() {
    document.getElementById('support-modal')?.classList.add('hidden');
  }

  // Auto-init countdown for visual verification preview
  startCountdown();
</script></main>
